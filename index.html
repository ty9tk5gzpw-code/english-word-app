<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    font-size: 20px;
    text-align: center;
    margin: 0;
    padding: 30px 20px;
  }

  button {
    font-size: 18px;
    padding: 12px 20px;
    margin: 8px;
  }

  #word {
    font-size: 36px;
    font-weight: bold;
  }

  #answer {
    font-size: 28px;
    margin: 25px;
  }
</style>

<h1>英単語トレーニング</h1>
<p id="word">increase</p>
<button id="answerButton" onclick="document.getElementById('answer').textContent='創り出す'">答えを見る</button>

<p id="answer"></p>
<button id="nextButton">次の単語</button>
<button id="correctButton">正解</button>
<button id="wrongButton">不正解</button>

<p id="score">正解数：0</p>
<button onclick="location.href='list.html'">単語一覧</button>
<p id="wrongCount">不正解数：0</p>
<p id="accuracy">正解率：0%</p>
<button id="restartButton">もう一度やる</button>
<p>出題方法</p>

<button id="normalButton">順番通り</button>
<button id="randomButton">ランダム</button>
<button id="random10Button">ランダム10問</button>
<button id="reviewButton">間違えた単語を復習</button>
<script src="script.js"></script>
</body>
</html>
